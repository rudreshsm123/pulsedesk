name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      # tests/integration uses Testcontainers, which talks to the Docker daemon
      # directly to spin up its own ephemeral Postgres -- already available on
      # GitHub-hosted runners, so no `services:` block is needed here.
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pulsedesk:${{ github.sha }}
          outputs: type=docker,dest=/tmp/pulsedesk-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: pulsedesk-image
          path: /tmp/pulsedesk-image.tar
          retention-days: 1

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (dependency CVEs)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pulsedesk-image
          path: /tmp
      - run: docker load --input /tmp/pulsedesk-image.tar
      - name: Trivy (image CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulsedesk:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "0" # report-only for this portfolio project; see docs/security.md

  # Deploying to Render/Railway/Supabase (Part 13 of the design doc) needs secrets
  # (API keys, service IDs) this repo doesn't have configured, so that step is a
  # manual, documented action rather than wired into CI -- see the README.

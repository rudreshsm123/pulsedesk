# Render Blueprint: deploys the API, Celery worker, and Celery beat as three services
# from the same Dockerfile. Deliberately does NOT provision Render's own Postgres --
# Supabase is used instead because it has pgvector built in (Render's managed Postgres
# extension allow-list is uncertain for pgvector); Redis is Upstash's free tier for the
# same "don't guess, use what's documented to work" reasoning. See README.md's
# deployment section for the exact click-through steps.
envVarGroups:
  - name: pulsedesk-shared
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Supabase connection string (Session pooler, port 5432) here
      - key: REDIS_URL
        sync: false # paste your Upstash Redis connection string here
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates a random 32+ byte secret for you
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false # paste your Groq API key here
      - key: LLM_CLASSIFY_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_RESOLUTION_MODEL
        value: openai/gpt-oss-120b
      - key: DEFAULT_SLA_HOURS
        value: "24"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

services:
  - type: web
    name: pulsedesk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    # Runs the migration on every deploy (idempotent -- a no-op if already at head)
    # rather than provisioning a separate one-off job service, since a single free-tier
    # demo deployment doesn't need that extra moving part.
    dockerCommand: >-
      sh -c "python -m alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - fromGroup: pulsedesk-shared

  - type: worker
    name: pulsedesk-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: pulsedesk-shared

  - type: worker
    name: pulsedesk-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - fromGroup: pulsedesk-shared

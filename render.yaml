# Render Blueprint: a single "web" service running the API, Celery worker, and Celery
# beat together (via scripts/render_web_start.sh). Render's free tier only supports
# the "web" service type -- background workers require a paid plan -- so this is a
# free-tier-specific compromise, not the intended architecture: docker-compose.yml
# (local dev) still runs api/worker/beat as three independent services, matching how
# this would actually be deployed with a budget.
#
# Deliberately does NOT provision Render's own Postgres -- Supabase is used instead
# because it has pgvector built in (Render's managed Postgres extension allow-list is
# uncertain for pgvector); Redis is Upstash's free tier for the same "don't guess, use
# what's documented to work" reasoning. See README.md's deployment section for the
# exact click-through steps.
envVarGroups:
  - name: pulsedesk-shared
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Supabase connection string (Session pooler, port 5432) here
      - key: REDIS_URL
        sync: false # paste your Upstash Redis connection string here
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates a random 32+ byte secret for you
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false # paste your Groq API key here
      - key: LLM_CLASSIFY_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_RESOLUTION_MODEL
        value: openai/gpt-oss-120b
      - key: DEFAULT_SLA_HOURS
        value: "24"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

services:
  - type: web
    name: pulsedesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    dockerCommand: sh ./render_web_start.sh
    envVars:
      - fromGroup: pulsedesk-shared

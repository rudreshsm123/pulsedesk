[pytest]
asyncio_mode = auto
# Function-scoped event loops (pytest-asyncio's default) give each async test a fresh
# loop, but the app's AsyncEngine/connection pool (app/core/db.py) is a process-wide
# singleton whose asyncpg connections are bound to whichever loop created them --
# reusing a pooled connection from an earlier test's already-closed loop raises
# "RuntimeError: Event loop is closed". A session-scoped loop matches how the real
# app actually runs (uvicorn keeps one loop alive for the process lifetime), so the
# pool is only ever used from the loop that created it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
